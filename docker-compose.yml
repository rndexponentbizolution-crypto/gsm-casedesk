# Every secret comes from .env and has no default: Compose refuses to start until
# they are set. Generate them once with: node infrastructure/generate-secrets.mjs
#
# Every port is bound to 127.0.0.1, so nothing here is reachable from other machines.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casedesk
      POSTGRES_USER: casedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node infrastructure/generate-secrets.mjs}
      # Used once, on a fresh volume, to create Keycloak's own database and user.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run node infrastructure/generate-secrets.mjs}
    # Host port 5433 by default so a locally installed PostgreSQL on 5432 can't
    # intercept connections meant for this container. Override with POSTGRES_HOST_PORT.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casedesk -d casedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes images to Docker Hub or Quay. Chainguard builds the
    # same open-source server; its free tier only offers the :latest tag.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: casedesk
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run node infrastructure/generate-secrets.mjs}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Optional virus scanning: docker compose --profile scan up -d clamav
  # (large image; loads its signature database for a minute or two on first start).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports:
      - "127.0.0.1:3310:3310"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    # The realm is imported on first start only; after that Keycloak's own database
    # holds it (and every staff sign-in), so recreating this container loses nothing.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run node infrastructure/generate-secrets.mjs}
      # Keycloak's own administrator (the admin console), not a CaseDesk account.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-keycloak-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Run node infrastructure/generate-secrets.mjs}
      # Substituted into the realm at import: the secret of CaseDesk's
      # account-management client.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Run node infrastructure/generate-secrets.mjs}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://casedesk:${POSTGRES_PASSWORD}@postgres:5432/casedesk
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      SIMULATION_ENABLED: "true"
      # The API fetches signing keys over the Docker network, but tokens are issued
      # to browsers at localhost.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8080}/realms/gsm-casedesk
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: casedesk-attachments
      S3_ACCESS_KEY: casedesk
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Compiled into the browser bundle, so these must be build args, not runtime env.
      # They are URLs the browser uses, hence localhost rather than service names.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_HOST_PORT:-8080}
        NEXT_PUBLIC_KEYCLOAK_REALM: gsm-casedesk
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: gsm-casedesk-web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
