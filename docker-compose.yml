services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casedesk
      POSTGRES_USER: casedesk
      POSTGRES_PASSWORD: casedesk
    # Host port 5433 by default so a locally installed PostgreSQL on 5432 can't
    # intercept connections meant for this container. Override with POSTGRES_HOST_PORT.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casedesk -d casedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes images to Docker Hub or Quay. Chainguard builds the
    # same open-source server; its free tier only offers the :latest tag.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: casedesk
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Optional virus scanning: docker compose --profile scan up -d clamav
  # (large image; loads its signature database for a minute or two on first start).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports:
      - "3310:3310"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://casedesk:casedesk@postgres:5432/casedesk
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      SIMULATION_ENABLED: "true"
      AUTH_MODE: keycloak
      # The API fetches signing keys over the Docker network, but tokens are issued
      # to browsers at localhost.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/gsm-casedesk
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: casedesk-attachments
      S3_ACCESS_KEY: casedesk
      S3_SECRET_KEY: change-me
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Compiled into the browser bundle, so these must be build args, not runtime env.
      # They are URLs the browser uses, hence localhost rather than service names.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_AUTH_MODE: keycloak
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: gsm-casedesk
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: gsm-casedesk-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
